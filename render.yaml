services:
  - type: web
    name: aders-accident-detection
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: 10000
      - key: RENDER
        value: "true"
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TWIML_BIN_URL
        value: https://demo.twilio.com/welcome/voice/
